<!doctype html>
<html><head><meta charset="utf-8"><title>Encoding Lab</title></head>
<body>
<h1>Input & Output Encoding Lab</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
<label>Nickname <input name="nickname" maxlength="30" autocomplete="off"></label>
<button type="submit">Submit</button>
</form>
{% if nickname %}<p>Rendered nickname: {{ nickname }}</p>{% endif %}
<p><a href="{{ url_for('index') }}">Back to lessons</a></p>
</body></html>
