<!doctype html>
<html><head><meta charset="utf-8"><title>Authentication Lab</title></head>
<body>
<h1>Authentication Lab</h1>
<p>This demo never creates or checks real accounts.</p>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="post">
<label>Username <input name="username" autocomplete="username"></label>
<label>Password <input type="password" name="password" autocomplete="current-password"></label>
<button type="submit">Demo login</button>
</form>
<p>Production checklist: password hashing (Argon2id/bcrypt), secure cookies, CSRF protection, rate limiting, MFA where appropriate, and generic login errors.</p>
<p><a href="{{ url_for('index') }}">Back to lessons</a></p>
</body></html>
